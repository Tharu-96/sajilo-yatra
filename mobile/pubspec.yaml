name: sajiloyatra
description: Sajilo Yatra Cinematic Transit
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  latlong2: ^0.9.0
  go_router: ^14.2.0
  http: ^1.1.0
  http_parser: ^4.1.2
  google_fonts: ^6.1.0
  flutter_dotenv: ^5.1.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  equatable: ^2.0.7
  uuid: ^4.5.1
  flutter_map_cancellable_tile_provider: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - images/
